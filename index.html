<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>雅思词汇胜经 · 遮挡背诵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE  安静、专注的背诵台，像一本摊开的词书加一张红色遮挡卡
   IDEA   学生背单词用的“红膜/遮挡卡”：盖住释义，只露英文
   PICTURE 原书页面本身，加一张可逐行掀开的红色遮挡板
   COLOUR 白纸 + 墨色；遮挡卡朱红；进度用深蓝；夜间是同一套颜色的暗版
   TYPE / LAYOUT  Noto Sans SC + JetBrains Mono 数字；顶部一行导航，页面居中 */
:root{color-scheme:light dark;
--bg:light-dark(#f6f7f9,#111418);--paper:light-dark(#ffffff,#1a1e24);--ink:light-dark(#17202a,#e6e9ee);
--mute:light-dark(#66707c,#9aa3ae);--line:light-dark(#e3e6ea,#2b313a);--blue:light-dark(#1d4e89,#7fb0ec);
--blue-s:light-dark(#e8f0fa,#1d2a3b);--red:#d4473c;--red-d:#a8322a;--ok:light-dark(#1f7a4d,#5fcf95);--warn:light-dark(#b45309,#f0a35a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans SC",system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
.num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:16px;margin-right:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 13px;border-radius:9px;color:var(--mute);text-decoration:none;font-size:15px;min-height:40px;display:inline-flex;align-items:center}
nav a.on{background:var(--blue-s);color:var(--blue);font-weight:700}
.sp{flex:1}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 15px;min-height:42px;cursor:pointer}
.btn:focus-visible,nav a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
main{max-width:1000px;margin:0 auto;padding:18px max(14px,4vw) 90px}
h1{font-size:30px;line-height:1.1;margin:6px 0 4px;text-wrap:balance}
h2{font-size:19px;margin:26px 0 10px}
.mute{color:var(--mute)}.small{font-size:13.5px}
.tip{background:var(--blue-s);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px}
.tip button{margin-left:auto;white-space:nowrap;flex:none;background:none;border:0;color:var(--mute);cursor:pointer;font-size:13px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tasks{display:grid;gap:10px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.task .ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--blue-s);color:var(--blue)}
.task.over .ico{background:light-dark(#fff1de,#3a2a14);color:var(--warn)}
.task.done{opacity:.55}.task.done .ico{background:var(--ok);color:#fff}
.tag{display:inline-block;white-space:nowrap;font-size:12.5px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.tag.w{color:var(--warn);border-color:currentColor;background:transparent}
.tag.r{color:var(--red-d);border-color:#f2b8b2;background:light-dark(#fdf0ee,#3a1f1d)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.stat b{display:block;font-size:26px;line-height:1.1}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 12px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink);min-height:40px}
.chip.on{border-color:var(--blue);background:var(--blue-s);color:var(--blue);font-weight:700}
.chip:disabled{opacity:.4;cursor:default}
.forecast{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px}
.forecast div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:12px;color:var(--mute);height:100%}
.forecast i{display:block;width:100%;max-width:38px;background:var(--blue);border-radius:5px 5px 2px 2px;min-height:2px}
.forecast i.add{background:repeating-linear-gradient(45deg,var(--blue),var(--blue) 4px,#7fa6d6 4px,#7fa6d6 8px)}
/* study */
.stbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.prog{flex:1;min-width:140px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue)}
.pageframe{position:relative}
.pagebox{position:relative;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;padding:6px;overscroll-behavior:contain}
.pagewrap{position:relative;margin:0 auto;background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 22px rgba(0,0,0,.08);overflow:hidden;flex:none}
.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12);overflow:hidden;opacity:.92}
.zoomctl button{font:inherit;font-size:15px;border:0;background:none;color:var(--ink);min-width:40px;height:38px;cursor:pointer;padding:0 8px}
.zoomctl .zl{font-size:12.5px;min-width:52px;border-inline:1px solid var(--line);font-variant-numeric:tabular-nums}
.pmodal{max-width:900px;width:100%}.pmodal .pagebox{height:calc(100dvh - 130px)}
.pagewrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
:root[data-theme=dark] .pagewrap img,.pagewrap.dim img{filter:none}
.cov{position:absolute;background:linear-gradient(180deg,var(--red),#c63d33);border-radius:3px;cursor:pointer;transition:opacity .18s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.cov::after{content:"点一下偷看";position:absolute;right:8px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.75);font-size:12px}
.cov.peek{opacity:.12;outline:2px dashed var(--red)}
.cov.peek::after{content:""}
.cov.c0{cursor:default}.cov.c0::after{content:""}
.ck{position:absolute;width:5.2%;aspect-ratio:1;min-width:22px;border:2.5px solid var(--blue);background:#fff;border-radius:5px;cursor:pointer;display:grid;place-items:center;padding:0}
.ck.on{background:var(--red);border-color:var(--red)}
.ck.on::after{content:"✕";color:#fff;font-weight:700;font-size:min(16px,70%);line-height:1}
.ck{color:#fff;font-size:15px}
.hl{position:absolute;border:3px solid var(--warn);border-radius:6px;pointer-events:none;animation:pulse 1.4s ease 2}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(240,163,90,.35)}}
@media(prefers-reduced-motion:reduce){.hl{animation:none}.cov{transition:none}}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--line);padding:10px max(14px,4vw) calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.study main,body.study main{padding-bottom:90px}
.allbox{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;width:5.2%;min-width:22px;cursor:pointer}
.allbox .ck{position:static;width:100%;border-style:dashed}.allbox .ck.on{border-style:solid}
.allbox span{font-size:12px;color:var(--red-d);font-weight:700;white-space:nowrap;background:#fff;padding:0 3px;border-radius:4px}
.allck{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;min-height:42px}
.ck2{width:26px;height:26px;border:2.5px solid var(--blue);background:#fff;border-radius:6px;cursor:pointer;display:grid;place-items:center;padding:0}
.ck2.on{background:var(--ok);border-color:var(--ok)}
.ck2.on::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.stbar .prog{max-width:260px}
.timer{font-size:14px;color:var(--mute)}
/* book */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cell{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);cursor:pointer;text-align:left;font:inherit;color:var(--ink);min-height:74px}
.cell b{display:block;font-size:15px}.cell span{font-size:12px;color:var(--mute);display:block}
.cell.s0{opacity:.42;cursor:default}.cell.s1{border-color:#9fbbe0}.cell.s2{background:var(--blue-s);border-color:var(--blue)}.cell.s3{background:light-dark(#e6f4ec,#183026);border-color:var(--ok)}.cell.s4{background:var(--ok);color:#fff;border-color:var(--ok)}.cell.s4 span{color:#e8fff2}
.bar{height:5px;border-radius:5px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mute);margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.calhead{display:flex;gap:8px;align-items:center;margin-bottom:10px}.calhead b{font-size:17px;min-width:110px;text-align:center}
.msum{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);margin-bottom:10px}.msum b{color:var(--ink)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk{text-align:center;font-size:12.5px;color:var(--mute)}
.cd{position:relative;min-height:66px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;text-align:left;padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.cd b{font-size:14px}.cd span{font-size:11.5px;line-height:1.3;color:var(--mute)}
.cd.empty{border:0;background:none;cursor:default}.cd.future{opacity:.5}
.cd.l1{background:light-dark(#eef4fb,#1b2533)}.cd.l2{background:light-dark(#d8e6f6,#1f3048)}.cd.l3{background:light-dark(#b9d0ee,#27405f)}.cd.l4{background:light-dark(#8fb3e2,#2f5482)}
.cd.today{box-shadow:inset 0 0 0 2px var(--blue)}.cd.sel{outline:2px solid var(--warn);outline-offset:1px}
.cd i{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.daydet{margin-top:12px;display:grid;gap:4px;font-size:14.5px}
.yeargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.ymh{border:0;background:none;font:inherit;font-weight:700;padding:0 0 4px;cursor:pointer;color:var(--ink)}
.ymg{display:grid;grid-template-columns:repeat(7,16px);gap:3px}.ymg i{width:16px;height:16px;border-radius:3px;background:var(--line);cursor:pointer}.ymg i.e{background:none;cursor:default}
.ymg i.l1{background:#b9d0ee}.ymg i.l2{background:#8fb3e2}.ymg i.l3{background:#5a8fd0}.ymg i.l4{background:var(--blue)}.ymg i.today{outline:2px solid var(--warn)}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}.lg.l1{background:#b9d0ee}.lg.l3{background:var(--blue)}.lg.dot{border-radius:50%;width:9px;height:9px;background:var(--warn)}
@media(max-width:600px){.cd{min-height:52px;padding:4px}.cd span{font-size:10.5px}.calgrid{gap:3px}}
.heat{display:grid;grid-auto-flow:column;grid-auto-columns:13px;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--line)}
.heat i.l1{background:#b9d0ee}.heat i.l2{background:#6f9fd8}.heat i.l3{background:var(--blue)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.thumbs button{border:1px solid var(--line);border-radius:6px;padding:0;background:#fff;cursor:pointer;overflow:hidden}
.thumbs img{width:100%;display:block}
.thumbs small{display:block;font-size:12px;color:#555;padding:2px}
/* words */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input[type=search],textarea,select{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper);color:var(--ink)}
input[type=search]{flex:1;min-width:160px}
table{width:100%;border-collapse:collapse;background:var(--paper);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14.5px;vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:500}
td.n{text-align:right}
tr.go{cursor:pointer}tr.go:hover td{background:var(--blue-s)}
.lv{white-space:nowrap;display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:99px}
.lv0{background:var(--line);color:var(--mute)}.lv1{background:#fbe3e1;color:var(--red-d)}.lv2{background:#fdf0d8;color:#8a5200}.lv3{background:var(--blue-s);color:var(--blue)}.lv4{background:var(--ok);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17202a;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:50;font-size:14.5px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:#9cc4f5;font:inherit;font-weight:700;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.5);display:grid;place-items:center;z-index:60;padding:16px}
.modal>div{background:var(--paper);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.modal textarea{width:100%;height:110px;font-size:13px;font-family:"JetBrains Mono",monospace}
.more{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.more summary{cursor:pointer;color:var(--mute);font-size:13.5px;min-height:32px;display:flex;align-items:center}
.more p{margin:6px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.scroll{overflow-x:auto}
@media(max-width:600px){h1{font-size:25px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}header b{width:100%}nav a{padding:7px 10px}.cov::after{content:""}th,td{padding:7px 6px;font-size:13.5px}.hide-m{display:none}.dock{gap:6px}.dock .btn{padding:8px 11px}#back{display:none}}
</style>
</head>

</header>
<main id="app"></main>

const ZKEY=KEY+'-zoom';let ZOOM=1;try{ZOOM=+localStorage.getItem(ZKEY)||1}catch(e){}
const clampZ=z=>Math.min(4,Math.max(.6,z));
function frameFit(fr){const box=fr.querySelector('.pagebox'),wr=box.querySelector('.pagewrap'),r=+wr.dataset.r;
 return Math.max(200,Math.min(box.clientWidth-12,(box.clientHeight-12)/r))}
function setZoom(fr,z,cx,cy){const box=fr.querySelector('.pagebox'),wr=box.querySelector('.pagewrap');
 z=clampZ(z);const old=wr.offsetWidth||1,oh=wr.offsetHeight||1,br=box.getBoundingClientRect();
 const px=cx==null?box.clientWidth/2:cx-br.left,py=cy==null?box.clientHeight/2:cy-br.top;
 const fx=(box.scrollLeft+px-wr.offsetLeft)/old,fy=(box.scrollTop+py-wr.offsetTop)/oh;
 ZOOM=z;try{localStorage.setItem(ZKEY,z)}catch(e){}
 wr.style.width=Math.round(frameFit(fr)*z)+'px';
 box.scrollLeft=fx*wr.offsetWidth+wr.offsetLeft-px;box.scrollTop=fy*wr.offsetHeight+wr.offsetTop-py;
 const zl=fr.querySelector('.zl');if(zl)zl.textContent=Math.abs(z-1)<.02?'适合':Math.round(z*100)+'%'}

 if(study){const dock=app.querySelector('.dock'),top=box.getBoundingClientRect().top+window.scrollY;
  box.style.height=Math.max(260,window.innerHeight-top-(dock?dock.offsetHeight:0)-6)+'px'}

 fr.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>setZoom(fr,b.dataset.z==='fit'?1:ZOOM*(b.dataset.z==='in'?1.25:.8)));
 box.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();setZoom(fr,ZOOM*Math.exp(-Math.max(-25,Math.min(25,e.deltaY))*.01),e.clientX,e.clientY)},{passive:false});
 let t0=null;
 box.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;t0={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:ZOOM}}},{passive:true});

  setZoom(fr,t0.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/t0.d,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2)}},{passive:false});

let CAL={view:'month',ym:null,sel:null};
const WK=['一','二','三','四','五','六','日'];
function dayStat(d){const g=S.log[d]||{},rev=g.rev||[],nw=g.new||[];
 const missed=Object.entries(S.lists).filter(([L,s])=>s.learned===d&&s.night==='missed').map(([L])=>+L);
 return {nw,rev,seen:g.seen||0,miss:g.miss||0,missed,act:nw.length+rev.length>0}}
function lvl(st){const v=st.nw.length*2+st.rev.length;return v>=8?4:v>=5?3:v>=2?2:v>0?1:0}
function streaks(){const days=Object.keys(S.log).filter(d=>dayStat(d).act).sort();let best=0,cur=0,prev=null;
 for(const d of days){cur=prev&&diff(d,prev)===1?cur+1:1;best=Math.max(best,cur);prev=d}
 const t=today();let now=0,d=dayStat(t).act?t:addDays(t,-1);while(dayStat(d).act){now++;d=addDays(d,-1)}
 return {best,now,total:days.length}}

  const first=new Date(y,m-1,1),n=new Date(y,m,0).getDate(),pad=(first.getDay()+6)%7;let cells='';let sum={days:0,nw:0,rev:0,seen:0};
  for(let i=0;i<pad;i++)cells+='<div class="cd empty"></div>';
  for(let d=1;d<=n;d++){const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,st=dayStat(ds);
   if(st.act){sum.days++;sum.nw+=st.nw.length;sum.rev+=st.rev.length;sum.seen+=st.seen}
   cells+=`<button class="cd l${lvl(st)} ${ds===t?'today':''} ${ds===CAL.sel?'sel':''} ${ds>t?'future':''}" data-day="${ds}"><b>${d}</b>${st.nw.length?`<span>新 ${st.nw.length}</span>`:''}${st.rev.length?`<span>复 ${st.rev.length}</span>`:''}${st.missed.length?'<i title="当晚没复习"></i>':''}</button>`}
  body=`<div class="calhead"><button class="btn sm" data-mon="-1" aria-label="上个月">‹</button><b>${y} 年 ${m} 月</b><button class="btn sm" data-mon="1" aria-label="下个月">›</button><button class="btn sm" data-mon="0">本月</button></div>
  <div class="msum small"><span>打卡 <b class="num">${sum.days}</b> 天</span><span>新背 <b class="num">${sum.nw}</b> 个 List</span><span>复习 <b class="num">${sum.rev}</b> 次</span><span>回忆单词 <b class="num">${sum.seen}</b> 次</span></div>
  <div class="calgrid">${WK.map(w=>`<div class="wk">${w}</div>`).join('')}${cells}</div>`;
 }else{
  let months='';
  for(let mm=1;mm<=12;mm++){const n=new Date(y,mm,0).getDate(),pad=(new Date(y,mm-1,1).getDay()+6)%7;let c='';let cnt=0;
   for(let i=0;i<pad;i++)c+='<i class="e"></i>';
   for(let d=1;d<=n;d++){const ds=`${y}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`,st=dayStat(ds);if(st.act)cnt++;
    c+=`<i class="l${lvl(st)} ${ds===t?'today':''}" data-day="${ds}" title="${ds}：新背 ${st.nw.length}、复习 ${st.rev.length}"></i>`}
   months+=`<div class="ym"><button class="ymh" data-gomon="${y}-${String(mm).padStart(2,'0')}">${mm} 月 <span class="mute">${cnt} 天</span></button><div class="ymg">${c}</div></div>`}
  body=`<div class="calhead"><button class="btn sm" data-year="-1" aria-label="上一年">‹</button><b>${y} 年</b><button class="btn sm" data-year="1" aria-label="下一年">›</button></div><div class="yeargrid">${months}</div>`;
 }
 const st=dayStat(CAL.sel),kind={stage:'阶段复习',pool:'巩固轮',whole:'今天整体回顾',night:'睡前复习'};
 const det=`<div class="card daydet"><b>${CAL.sel===t?'今天':md(CAL.sel)}</b>${st.act?`
  ${st.nw.length?`<div>新背：${st.nw.map(LN).join('、')}</div>`:''}
  ${st.rev.length?`<div>复习：${st.rev.map(r=>`${LN(r.L)}（${kind[r.k]||r.k}）`).join('、')}</div>`:''}
  ${st.seen?`<div>回忆单词 ${st.seen} 次，想不起来 ${st.miss} 次</div>`:''}
  ${st.missed.length?`<div style="color:var(--warn)">当晚没复习：${st.missed.map(LN).join('、')}（不影响后面的安排）</div>`:''}`:'<div class="mute">这天没有背诵记录。</div>'}</div>`;
 return `<h1>打卡日历</h1>
 <div class="stats"><div class="card stat"><b class="num">${sk.now}</b><span class="small mute">当前连续打卡（天）</span></div><div class="card stat"><b class="num">${sk.best}</b><span class="small mute">最长连续（天）</span></div><div class="card stat"><b class="num">${sk.total}</b><span class="small mute">累计打卡（天）</span></div><div class="card stat"><b class="num">${Object.keys(S.lists).length}<span class="mute" style="font-size:15px">/${TOTAL_LISTS}</span></b><span class="small mute">已开始的 List</span></div></div>
 <div class="tools"><button class="chip ${CAL.view==='month'?'on':''}" data-view2="month">按月</button><button class="chip ${CAL.view==='year'?'on':''}" data-view2="year">按年</button>
 <span class="legend" style="margin:0 0 0 auto"><span><i class="lg l1"></i>少</span><span><i class="lg l3"></i>多</span><span><i class="lg dot"></i>当晚没复习</span></span></div>
 <div class="card">${body}</div>${det}`;
}
function bindCal(){
 app.querySelectorAll('[data-view2]').forEach(b=>b.onclick=()=>{CAL.view=b.dataset.view2;route()});
 app.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>{const k=+b.dataset.mon;if(!k){CAL.ym=today().slice(0,7)}else{const [y,m]=CAL.ym.split('-').map(Number),d=new Date(y,m-1+k,1);CAL.ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}route()});
 app.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{const [y,m]=CAL.ym.split('-').map(Number);CAL.ym=(y+ +b.dataset.year)+'-'+String(m).padStart(2,'0');route()});
 app.querySelectorAll('[data-gomon]').forEach(b=>b.onclick=()=>{CAL.ym=b.dataset.gomon;CAL.view='month';route()});
 app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{CAL.sel=b.dataset.day;if(CAL.view==='year'){CAL.ym=CAL.sel.slice(0,7);CAL.view='month'}route()});
}
function viewPage(pg,hl){
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="pmodal"><div class="row" style="margin:0 0 10px"><b>PDF 第 ${pg} 页</b><span class="sp"></span><button class="btn sm" id="mcov">盖住${CL}</button><button class="btn sm" id="mx">关闭</button></div><div id="mp">${pageHTML(pg,{hl})}</div></div>`;
 layer.appendChild(m);let c=false;setupFrame(m.querySelector('.pageframe'),false);
 m.onclick=e=>{if(e.target===m)m.remove()};m.querySelector('#mx').onclick=()=>m.remove();
 m.querySelector('#mcov').onclick=e=>{c=!c;e.target.textContent=c?'显示'+CL:'盖住'+CL;m.querySelector('#mp').innerHTML=pageHTML(pg,{cover:c,hl});setupFrame(m.querySelector('.pageframe'),false);
  m.querySelectorAll('[data-peek]').forEach(b=>b.onclick=()=>b.classList.toggle('peek'))};
 if(hl)setTimeout(()=>m.querySelector('.hl')?.scrollIntoView({block:'center'}),80);
}
// ---------- words ----------
let WF={q:'',f:'all'};
function vWords(){
 const rows=W.filter(w=>{const lv=level(w);if(WF.f==='weak'&&!(lv===1||lv===2))return false;if(WF.f==='new'&&lv)return false;if(WF.f==='good'&&lv<3)return false;
  return !WF.q||w.w.toLowerCase().includes(WF.q)||w.g.includes(WF.q)});
 const cnt=[0,0,0,0,0];W.forEach(w=>cnt[level(w)]++);
 return `<h1>熟练度</h1><p class="mute small">每次遮挡回忆时勾没勾，都会记下来；记住率 = 勾上的次数 / 回忆的次数。</p>
 ${tip('words','“易忘词”= 陌生 + 模糊。点一行会打开原书那一页，并高亮这个词。')}
 <div class="stats">${[1,2,3,4].map(i=>`<div class="card stat"><b class="num">${cnt[i]}</b><span class="lv lv${i}">${LV[i]}</span></div>`).join('')}</div>
 <div class="tools"><input type="search" id="q" placeholder="搜单词或中文" value="${esc(WF.q)}">
 ${[['all','全部 '+W.length],['weak','易忘词 '+(cnt[1]+cnt[2])],['good','熟悉以上 '+(cnt[3]+cnt[4])],['new','未背 '+cnt[0]]].map(([k,l])=>`<button class="chip ${WF.f===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
 <div class="scroll"><table><thead><tr><th>单词</th><th class="hide-m">释义</th><th>位置</th><th class="n">遍数</th><th class="n">记住率</th><th>熟练度</th><th class="hide-m">最近忘记</th></tr></thead><tbody>
 ${rows.slice(0,400).map(w=>{const r=S.words[w.id],lv=level(w);return `<tr class="go" data-w="${w.id}"><td><b>${esc(w.w)}</b></td><td class="hide-m small">${esc(w.g)}</td><td class="small num" style="white-space:nowrap">L${w.L}·p${w.p}</td><td class="n num">${S.lists[w.L]?.passes||0}</td><td class="n num">${r?.n?Math.round(r.ok/r.n*100)+'%':'—'}</td><td><span class="lv lv${lv}">${LV[lv]}</span></td><td class="hide-m small num">${r?.miss?md(r.miss):'—'}</td></tr>`}).join('')}
 </tbody></table></div>${rows.length?'':'<p class="mute">没有符合条件的词。</p>'}`;
}
function bindWords(){
 const q=$('#q');q.oninput=()=>{WF.q=q.value.trim().toLowerCase();const p=q.selectionStart;route();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
 app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{WF.f=b.dataset.f;route()});
 app.querySelectorAll('[data-w]').forEach(r=>r.onclick=()=>{const w=W.find(x=>x.id===r.dataset.w);viewPage(w.p,w.id)});
}
// ---------- sync code ----------
$('#bSync').onclick=()=>{
 const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div><h2 style="margin-top:0">进度码</h2><p class="small mute">进度只存在这个浏览器里。换设备时：在这里复制进度码，到另一台设备粘贴导入。（想清空进度从头再来，在“今日”页最下面的设置里。）</p>
 <textarea readonly id="out">${code}</textarea><div class="row"><button class="btn pri" id="cp">复制进度码</button></div>
 <h2>导入</h2><textarea id="in" placeholder="把另一台设备的进度码粘贴到这里"></textarea>
 <div class="row"><button class="btn" id="imp">导入（会替换当前进度，可撤销）</button></div>
 <div class="row"><span class="sp"></span><button class="btn" id="cl">关闭</button></div></div>`;
 layer.appendChild(m);const close=()=>m.remove();m.onclick=e=>{if(e.target===m)close()};m.querySelector('#cl').onclick=close;
 m.querySelector('#cp').onclick=async e=>{try{await navigator.clipboard.writeText(code);e.target.textContent='已复制'}catch(err){m.querySelector('#out').select();e.target.textContent='已选中，请手动复制'}};
 m.querySelector('#imp').onclick=()=>{const v=m.querySelector('#in').value.trim();try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o.lists)throw 0;const b=snap();S=Object.assign(blank(),o);save();close();route();toast('已导入进度',b)}catch(e){m.querySelector('#in').style.borderColor='var(--red)';m.querySelector('#imp').textContent='进度码不对，请检查'}};
};
// ---------- router ----------
function route(){
 const h=(location.hash||'#today').slice(1);
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h||(h==='study'&&a.getAttribute('href')==='#today')));
 if(h!=='study')clearInterval(timerI);
 if(h==='book'){app.innerHTML=vBook();bindBook()}
 else if(h==='calendar'){app.innerHTML=vCal();bindCal()}
 else if(h==='words'){app.innerHTML=vWords();bindWords()}
 else if(h==='study'){app.innerHTML=vStudy();bindStudy();window.scrollTo(0,0);fitPage()}
 else{app.innerHTML=vToday();bindToday()}
}
addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
